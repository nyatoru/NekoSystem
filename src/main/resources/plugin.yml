main: com.nyarutoru.nekoplugin.NekoPlugin
version: 1.0.0-SNAPSHOT
name: NekoPlugin
author: NyaruToru
api-version: 1.21
folia-supported: true

commands:
  givehammer:
    description: Give an unbreakable hammer
    usage: /givehammer <tier> [player]
