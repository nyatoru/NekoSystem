plugins {
    id 'java'
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.21"
}

group = 'com.nyarutoru.nekoplugin'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}


dependencies {
    paperweight.paperDevBundle("26.2.build.+")

    // Testing dependencies
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Xlint:deprecation']
    options.deprecation = true
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// ponytail: minimal resource pack build — zips pack.mcmeta + assets/nekoplugin from resources.
// Run ./gradlew buildResourcePack -> build/libs/NekoPlugin-ResourcePack.zip (host via server.properties resource-pack or external http)
tasks.register('buildResourcePack', Zip) {
    archiveBaseName = 'NekoPlugin-ResourcePack'
    archiveVersion = ''
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('libs')
    from('src/main/resources') {
        include 'pack.mcmeta'
        include 'assets/**'
    }
}
build.dependsOn buildResourcePack

// ponytail: Bedrock/Geyser conversion — generates Bedrock pack + Geyser v2 mappings.
// Java pack uses custom_model_data on pickaxe/compass (pack overrides vanilla item definitions,
// so no pack = vanilla item). Bedrock has no item_model, so Geyser maps each Java item+custom_model_data
// -> Bedrock custom item via legacy definitions.
// Output: build/libs/NekoPlugin-BedrockPack.mcpack (copy to Geyser packs/ or Bedrock client)
//         build/libs/NekoPlugin-GeyserMappings.json (copy to Geyser custom_mappings/)
def bedrockStaging = layout.buildDirectory.dir("tmp/bedrockStaging")
tasks.register('prepareBedrockStaging') {
    doLast {
        def dir = bedrockStaging.get().asFile
        delete dir
        dir.mkdirs()
        new File(dir, "manifest.json").text = """{
  "format_version": 2,
  "header": {
    "name": "NekoPlugin Bedrock",
    "description": "NekoPlugin Hammers & Magnet — GeyserMC Bedrock Pack",
    "uuid": "fdde5a82-a4f9-4456-8a26-d1682358d313",
    "version": [1, 0, 0],
    "min_engine_version": [1, 20, 0]
  },
  "modules": [
    {
      "type": "resources",
      "uuid": "6edb27d4-aa51-49a9-9b3c-e7c0196735cd",
      "version": [1, 0, 0]
    }
  ]
}"""
        def texDir = new File(dir, "textures")
        texDir.mkdirs()
        new File(texDir, "item_texture.json").text = """{
  "resource_pack_name": "NekoPlugin",
  "texture_name": "atlas.items",
  "texture_data": {
    "nekoplugin:hammer_wooden": { "textures": "textures/items/hammer_wooden" },
    "nekoplugin:hammer_stone": { "textures": "textures/items/hammer_stone" },
    "nekoplugin:hammer_iron": { "textures": "textures/items/hammer_iron" },
    "nekoplugin:hammer_golden": { "textures": "textures/items/hammer_golden" },
    "nekoplugin:hammer_diamond": { "textures": "textures/items/hammer_diamond" },
    "nekoplugin:hammer_netherite": { "textures": "textures/items/hammer_netherite" },
    "nekoplugin:magnet": { "textures": "textures/items/magnet" },
    "nekoplugin:magnet_recovery": { "textures": "textures/items/magnet" }
  }
}"""
        def textsDir = new File(dir, "texts")
        textsDir.mkdirs()
        new File(textsDir, "en_US.lang").text = """## NekoPlugin Bedrock — custom item names
item.nekoplugin:hammer_wooden=Wooden Hammer
item.nekoplugin:hammer_stone=Stone Hammer
item.nekoplugin:hammer_iron=Iron Hammer
item.nekoplugin:hammer_golden=Golden Hammer
item.nekoplugin:hammer_diamond=Diamond Hammer
item.nekoplugin:hammer_netherite=Netherite Hammer
item.nekoplugin:magnet=Magnet
item.nekoplugin:magnet_recovery=Magnet

## pack description
pack.description=NekoPlugin Hammers & Magnet — GeyserMC Bedrock Pack
"""
        // pack_icon.png = copy magnet.png (16x16) — Bedrock shows any png, 256 recommended but not required
        def srcIcon = file("src/main/resources/assets/nekoplugin/textures/item/magnet.png")
        if (srcIcon.exists()) {
            copy {
                from srcIcon
                into dir
                rename { "pack_icon.png" }
            }
        }
    }
}

tasks.register('buildBedrockPack', Zip) {
    dependsOn 'prepareBedrockStaging'
    archiveBaseName = 'NekoPlugin-BedrockPack'
    archiveVersion = ''
    archiveClassifier = ''
    archiveExtension = 'mcpack'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(bedrockStaging)
    from("src/main/resources/assets/nekoplugin/textures/item") {
        into "textures/items"
        include "*.png"
        // duplicate magnet for recovery variant
        rename { name -> name }
    }
    // also include duplicate for recovery
    doLast {
        // ensure magnet_recovery texture exists (copy magnet.png)
        def zipFile = archiveFile.get().asFile
        // Geyser/Bedrock will resolve magnet_recovery via item_texture pointing to same png file, no duplicate file needed
    }
}

